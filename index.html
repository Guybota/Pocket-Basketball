<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <!-- viewport-fit=cover para o iPhone nos dizer a altura da barra de estado: pintamos essa faixa de escuro, e o desfoque do sistema fica sobre uma cor lisa. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Pocket Basketball</title>
    <link rel="icon" href="data:,">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Pocket Basketball">
    <!-- Instalado no ecrã inicial do iPhone: a barra de estado fica por cima da página, e a faixa por baixo dela é pintada por nós. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1b2230">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- As letras chegam sem travar o primeiro desenho: até lá, usa-se a letra de reserva do style.css. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+15&family=Jersey+20&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="/src/ui/style.css">
  </head>
  <body>
    <div id="game">
      <div class="screen" id="screen">
        <canvas id="court" width="360" height="216" role="img" aria-label="Pocket Basketball"></canvas>
        <div id="hud"></div>
        <div id="banner" hidden></div>
      </div>
      <div id="panel"></div>
    </div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
