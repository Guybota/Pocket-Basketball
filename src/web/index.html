<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Basketball</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0 auto; max-width: 48rem; padding: 1rem; }
    output { display: block; white-space: pre-wrap; font: 0.85rem/1.4 ui-monospace, monospace; }
    input { width: 6rem; }
  </style>
</head>
<body>
  <h1>Pocket Basketball</h1>
  <p>Versão de teste da simulação. A mesma semente dá sempre o mesmo jogo.</p>
  <form>
    <label for="seed">Semente</label>
    <input id="seed" type="number" step="1" value="1">
    <button>Simular jogo</button>
  </form>
  <output aria-live="polite"></output>
  <script type="module" src="web/main.js"></script>
</body>
</html>
